<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2e"><title>USD/JPY 市場ダッシュボード</title>
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf1fb;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:18px}h1{font-size:1.35rem;margin:0 0 6px}.muted{color:#a5b5cd;font-size:.8rem}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}button{background:#263d62;border:1px solid #3e5982;border-radius:10px;color:white;padding:10px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#15243a;border:1px solid #2b405c;border-radius:14px;padding:15px;min-height:126px;text-align:left;width:100%}.card:focus{outline:2px solid #8cb8ff}.name{font-size:.85rem;color:#bacbe0}.val{font-size:1.65rem;font-weight:750;margin:9px 0 4px}.small{font-size:.75rem;color:#a5b5cd}.up{color:#ff9b98}.down{color:#84dbbd}.section{margin:20px 0 10px;font-size:1rem}#detail{background:#15243a;border:1px solid #2b405c;border-radius:14px;padding:16px;margin-top:16px}svg{width:100%;height:190px;display:block}a{color:#a9ccff}footer{margin:20px 0;color:#9aabc3;font-size:.77rem;line-height:1.7}@media(min-width:650px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.val{font-size:1.4rem}}
</style></head><body><main><header><div><h1>USD/JPY 市場ダッシュボード</h1><div class="muted" id="updated">データ読込前</div></div><button id="refresh">更新</button></header><div class="grid" id="cards"></div><section id="detail"><b>指標をタップすると履歴を表示</b></section><footer>15分ごとに取得を試みますが、GitHub Actionsの実行遅延やデータ提供元の更新頻度により、15分以内の価格を保証するものではありません。日本国債の無料で安定した配信元は未接続です。Yahoo Financeの非公式エンドポイントは変更・停止する場合があります。投資判断には公式情報も確認してください。</footer></main><script>
const definitions=[['us2','米国2年債','%'],['us10','米国10年債','%'],['jp2','日本2年債','%'],['jp10','日本10年債','%'],['dxy','ドル指数 DXY',''],['real10','米10年実質金利','%'],['vix','VIX指数',''],['curve','米10年−2年','pt'],['wti','WTI原油','USD/bbl'],['brent','ブレント原油','USD/bbl']];let data={items:{}};
const fmt=(v,unit)=>v==null?'—':Number(v).toFixed(unit==='USD/bbl'?2:unit==='pt'?3:2)+(unit==='%'?'%':unit==='pt'?'pt':'');
const local=t=>t?new Date(t).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'—';
function render(){document.getElementById('updated').textContent='データ取得処理: '+local(data.fetched_at)+' / 表示値は各指標の観測時刻を確認';document.getElementById('cards').innerHTML=definitions.map(([id,name,unit])=>{const x=data.items?.[id];const d=x&&x.previous!=null?x.value-x.previous:null;return `<button class="card" data-id="${id}"><div class="name">${name}</div><div class="val">${fmt(x?.value,unit)}</div><div class="small ${d>0?'up':d<0?'down':''}">${d==null?'未取得 / 前回比なし':(d>0?'+':'')+d.toFixed(3)+' 変化'}</div><div class="small">${x?x.frequency:'取得元未接続'}</div></button>`}).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>detail(b.dataset.id));}
function detail(id){let [_,name,unit]=definitions.find(x=>x[0]===id),x=data.items?.[id],el=document.getElementById('detail');if(!x){el.innerHTML=`<b>${name}</b><p class="muted">現在データを取得できません。値を推測して表示することはありません。</p>`;return}const a=x.history||[],values=a.map(z=>z.v),lo=Math.min(...values),hi=Math.max(...values),span=hi-lo||1;const points=a.map((z,i)=>`${12+i* (676/Math.max(1,a.length-1))},${170-(z.v-lo)/span*145}`).join(' ');el.innerHTML=`<b>${name}</b><p>${fmt(x.value,unit)}</p><div class="muted">観測時刻：${x.observed_at.includes('T')?local(x.observed_at):x.observed_at} / ${x.frequency}</div><svg viewBox="0 0 700 190" role="img" aria-label="${name}の推移"><polyline fill="none" stroke="#77b6ff" stroke-width="3" points="${points}"/></svg><div class="muted">表示範囲 ${fmt(lo,unit)} ～ ${fmt(hi,unit)}</div><p class="muted">出典：${x.source} ${x.url?`<a href="${x.url}" target="_blank" rel="noopener">元データ</a>`:''}</p>`}
async function load(){try{let r=await fetch('./data/latest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();render()}catch(e){document.getElementById('updated').textContent='データファイル未配置または取得失敗';render()}}document.getElementById('refresh').onclick=load;render();load();setInterval(load,15*60*1000);
</script></body></html>
